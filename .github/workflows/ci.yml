name: Stable verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Java 25 / ${{ matrix.os }} / no Docker
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify IDEA source dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew -I scripts/verify-idea-sources.init.gradle verifyIdeaSources --no-configuration-cache --dependency-verification strict
      - name: Verify IDEA source dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat -I scripts/verify-idea-sources.init.gradle verifyIdeaSources --no-configuration-cache --dependency-verification strict
      - name: Normal build (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew clean build --no-build-cache
      - name: Normal build (Windows, no Bash)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean build --no-build-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DexturReputation-1.0.1-${{ matrix.os }}
          path: |
            reputation-paper/build/libs/DexturReputation.jar
            reputation-paper/build/libs/DexturReputation-StorageAdmin.jar
            **/build/reports/tests/
  release-sql:
    name: Full release / MariaDB and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: docker info
      - name: All normal tests and mandatory SQL tests
        run: ./gradlew clean releaseCheck --no-build-cache
      - name: Save reproducibility reference
        run: |
          mkdir -p "$RUNNER_TEMP/reproducibility"
          cp reputation-paper/build/libs/DexturReputation.jar "$RUNNER_TEMP/reproducibility/"
          cp reputation-paper/build/libs/DexturReputation-StorageAdmin.jar "$RUNNER_TEMP/reproducibility/"
      - name: Rebuild packaging independently
        run: ./gradlew :reputation-paper:shadowJar :reputation-paper:storageAdminJar --rerun-tasks --no-build-cache
      - name: Compare artifacts and write checksums
        run: |
          cmp "$RUNNER_TEMP/reproducibility/DexturReputation.jar" reputation-paper/build/libs/DexturReputation.jar
          cmp "$RUNNER_TEMP/reproducibility/DexturReputation-StorageAdmin.jar" reputation-paper/build/libs/DexturReputation-StorageAdmin.jar
          cd reputation-paper/build/libs
          sha256sum DexturReputation.jar DexturReputation-StorageAdmin.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DexturReputation-1.0.1-release-sql
          path: |
            reputation-paper/build/libs/DexturReputation.jar
            reputation-paper/build/libs/DexturReputation-StorageAdmin.jar
            reputation-paper/build/libs/SHA256SUMS
            **/build/reports/tests/
            **/build/reports/release/
