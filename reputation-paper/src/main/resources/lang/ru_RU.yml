storage-status: '<gray>Активное хранилище: {type}. Перенос выполняется только офлайн через StorageAdmin.</gray>'
storage-failed: '<red>Хранилище {type} не запущено ({error}). Проверьте storage.yml, доступ к файлам/БД и незавершённые миграции. Автоматического переключения нет.</red>'
storage-config-invalid: '<red>Конфигурация хранилища отклонена: {reason}.</red>'
storage-admin-usage: '<yellow>Остановите все серверы/писателей. migrate: --data-directory DIR --target-config FILE [--backups DIR]; recover-json: --data-directory DIR --candidate backup|temporary. Обязательно --confirm STOPPED-ALL-WRITERS; язык: --language ru_RU|en_US.</yellow>'
storage-migrated: '<green>Перенос проверен, новая конфигурация активирована. Профилей: {profiles}; языков: {preferences}; SHA-256: {checksum}. Резервная копия: {backup}. Старые данные сохранены; запускайте сервер после проверки отчёта.</green>'
storage-recovered: '<yellow>JSON восстановлен из явно выбранной копии. Предыдущие файлы сохранены: {backup}. Восстановление старой версии может отменить последние изменения; проверьте данные до запуска.</yellow>'
storage-admin-failed: '<red>Операция хранилища не завершена ({error}). Проверьте конфигурацию, блокировки, место, права и резервные копии. Не активируйте незавершённое назначение; используйте новое пустое хранилище для повторного переноса.</red>'
