config-version: 1
prefix: '<dark_gray>[<aqua>Reputation</aqua>]</dark_gray> '
help: '<gray>/rep [player] — profile; /rep language [language] — ru_RU or en_US; /dexturreputation help|version|status</gray>'
version: '<gray>DexturReputation {version}; Paper 26.2; Java 25.</gray>'
status: '<gray>State: {state}; database queue: {queue}; PlaceholderAPI: {integration}.</gray>'
profile: '<white>{player}</white><gray>: reputation {reputation}, tier {tier}.</gray>'
language-set: '<green>Language saved: {language}.</green>'
language-usage: '<yellow>Usage: /rep language [ru_RU|en_US]</yellow>'
unknown-player: '<red>Player {player} is not known to this server.</red>'
players-only: '<red>This command is only available to players.</red>'
no-permission: '<red>You do not have permission.</red>'
unavailable: '<yellow>The reputation service is currently unavailable.</yellow>'
error: '<red>The request failed. Try again later; an administrator can check the server log.</red>'
usage: '<yellow>Usage: /rep [player] or /rep language [ru_RU|en_US].</yellow>'
tier-neutral: 'Neutral'
state-ready: 'ready'
state-starting: 'starting'
integration-active: 'enabled'
integration-inactive: 'disabled'
storage-status: '<gray>Active storage: {type}. Migrations are offline operations through StorageAdmin.</gray>'
storage-failed: '<red>Storage {type} did not start ({error}). Check storage.yml, file/database access and pending migrations. There is no automatic fallback.</red>'
storage-config-invalid: '<red>Storage configuration rejected: {reason}.</red>'
storage-admin-usage: '<yellow>Stop every server/writer. migrate: --data-directory DIR --target-config FILE [--backups DIR]; recover-json: --data-directory DIR --candidate backup|temporary. Required: --confirm STOPPED-ALL-WRITERS; locale: --language ru_RU|en_US.</yellow>'
storage-migrated: '<green>Migration verified and new configuration activated. Profiles: {profiles}; languages: {preferences}; SHA-256: {checksum}. Backup: {backup}. Old data retained; review the report before restarting.</green>'
storage-recovered: '<yellow>JSON restored from the explicitly selected copy. Previous files retained at {backup}. Restoring an older version may roll back recent changes; verify data before starting.</yellow>'
storage-admin-failed: '<red>Storage operation did not complete ({error}). Check configuration, ownership locks, space, permissions and backups. Do not activate an incomplete target; use a fresh empty destination for another migration.</red>'
