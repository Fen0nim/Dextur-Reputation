name: DexturReputation
version: '${version}'
main: org.dextur.reputation.paper.DexturReputationPlugin
api-version: '26.2'
description: Asynchronous reputation, tiers and display for Dextur (Phase 7)
load: POSTWORLD
softdepend: [PlaceholderAPI, LuckPerms, TAB]
commands:
  dexturreputation:
    description: Reputation diagnostics and help
  rep:
    description: Reputation profile and language selection
  repadmin:
    description: Reputation administration and investigation
  like:
    description: Positive reputation vote
  dislike:
    description: Negative reputation vote
permissions:
  dexturreputation.use:
    default: true
  dexturreputation.language:
    default: true
  dexturreputation.status:
    default: op
  dexturreputation.vote:
    default: true
  dexturreputation.like:
    default: true
  dexturreputation.dislike:
    default: true
  dexturreputation.revoke:
    default: true
  dexturreputation.history:
    default: true
  dexturreputation.gui:
    default: true
  dexturreputation.reasons:
    default: true
  dexturreputation.recovery:
    default: true
  dexturreputation.recovery.start:
    default: true
  dexturreputation.recovery.status:
    default: true
  dexturreputation.recovery.cancel:
    default: true
  dexturreputation.recovery.admin:
    default: op
  dexturreputation.policies:
    default: true
  dexturreputation.admin.set:
    default: op
  dexturreputation.admin.add:
    default: op
  dexturreputation.admin.remove:
    default: op
  dexturreputation.admin.voting.lock:
    default: op
  dexturreputation.admin.voting.unlock:
    default: op
  dexturreputation.admin.voting.status:
    default: op
  dexturreputation.admin.policy:
    default: op
  dexturreputation.admin.reload:
    default: op
  dexturreputation.admin.inspect:
    default: op
  dexturreputation.admin.history:
    default: op
  dexturreputation.admin.vote.inspect:
    default: op
  dexturreputation.admin.vote.invalidate:
    default: op
  dexturreputation.admin.vote.restore:
    default: op
  dexturreputation.admin.pending.view:
    default: op
  dexturreputation.admin.pending.approve:
    default: op
  dexturreputation.admin.pending.reject:
    default: op
  dexturreputation.admin.trust.inspect:
    default: op
  dexturreputation.admin.flags.inspect:
    default: op
  dexturreputation.admin.flags.resolve:
    default: op
  dexturreputation.admin.relations.inspect:
    default: op
  dexturreputation.admin.recalculate.reputation:
    default: op
  dexturreputation.admin.recalculate.trust:
    default: op
  dexturreputation.admin.recalculate.tier:
    default: op
  dexturreputation.admin.recalculate.all:
    default: op
  dexturreputation.admin.audit:
    default: op
  dexturreputation.admin.gui:
    default: op
  dexturreputation.admin.bulk:
    default: op
